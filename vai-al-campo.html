<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vai al campo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#b3122b">
<meta name="description" content="Apri la posizione del campo nel tuo navigatore preferito: Waze, Google Maps o Apple Mappe.">
<meta property="og:title" content="Vai al campo">
<meta property="og:description" content="Apri la posizione del campo nel tuo navigatore preferito: Waze, Google Maps o Apple Mappe.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #f7f3ec;
    --surface: #fffdf9;
    --ink: #241f1c;
    --ink-soft: #6d635b;
    --line: #e4dccd;
    --accent: #b3122b;      /* giallorosso — Susegana */
    --amber: #e0972f;
    --amber-wash: #f6e6c9;
    --focus: #1f6feb;
    --mark-waze: #3f93c7;
    --mark-gmaps: #5f8a58;
    --mark-apple: #71808d;
    --mark-geo: #4b423b;
    --shadow: 0 18px 44px -20px rgba(60, 40, 20, .45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #171310;
      --surface: #211b16;
      --ink: #f2e9dd;
      --ink-soft: #a89a8a;
      --line: #362d24;
      --accent: #ef5163;
      --amber: #e6a743;
      --amber-wash: #3a2e18;
      --focus: #6aa9ff;
      --mark-waze: #3f93c7;
      --mark-gmaps: #6b9a63;
      --mark-apple: #8492a0;
      --mark-geo: #cdbfae;
      --shadow: 0 18px 44px -22px rgba(0, 0, 0, .7);
    }
  }
  :root[data-theme="dark"] {
    --ground: #171310;
    --surface: #211b16;
    --ink: #f2e9dd;
    --ink-soft: #a89a8a;
    --line: #362d24;
    --accent: #ef5163;
    --amber: #e6a743;
    --amber-wash: #3a2e18;
    --focus: #6aa9ff;
    --mark-waze: #3f93c7;
    --mark-gmaps: #6b9a63;
    --mark-apple: #8492a0;
    --mark-geo: #cdbfae;
    --shadow: 0 18px 44px -22px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--ground);
    color: var(--ink);
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }

  .card {
    width: min(100%, 400px);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .match {
    padding: 22px 22px 20px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .match::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent) 0 55%, var(--amber) 55% 100%);
  }
  .eyebrow {
    margin: 6px 0 10px;
    font-family: "Barlow Semi Condensed", "Barlow", sans-serif;
    font-weight: 600;
    font-size: .74rem;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0;
    font-family: "Barlow Semi Condensed", "Barlow", sans-serif;
    font-weight: 700;
    font-size: 1.62rem;
    line-height: 1.1;
    letter-spacing: -.005em;
    text-wrap: balance;
  }
  .when {
    margin: 6px 0 16px;
    font-size: .92rem;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  .venue {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  .venue-name { font-weight: 600; font-size: .98rem; }
  .venue-addr { font-size: .9rem; color: var(--ink-soft); }
  .coords {
    margin-top: 4px;
    font-size: .78rem;
    letter-spacing: .02em;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    font-family: "Barlow", ui-monospace, monospace;
  }

  .apps {
    display: flex;
    flex-direction: column;
    padding: 14px;
    gap: 8px;
  }
  .apps.collapsed .app[data-pref="0"] { display: none; }

  .app {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--surface);
    color: inherit;
    text-decoration: none;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .app:hover { border-color: var(--ink-soft); }
  .app:active { transform: scale(.985); }
  .app:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .app[data-pref="1"] {
    order: -1;
    border-color: var(--amber);
    background: var(--amber-wash);
  }

  .mark {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    color: #fff;
  }
  .mark svg { width: 21px; height: 21px; display: block; }
  .mark-waze { background: var(--mark-waze); }
  .mark-gmaps { background: var(--mark-gmaps); }
  .mark-apple { background: var(--mark-apple); }
  .mark-geo { background: var(--mark-geo); }

  .app-text { display: flex; flex-direction: column; min-width: 0; }
  .app-name {
    font-family: "Barlow Semi Condensed", "Barlow", sans-serif;
    font-weight: 600;
    font-size: 1.06rem;
  }
  .app-sub { font-size: .82rem; color: var(--ink-soft); }

  .tail { display: flex; align-items: center; gap: 10px; }
  .chip {
    font-family: "Barlow Semi Condensed", "Barlow", sans-serif;
    font-size: .66rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--amber);
    border: 1px solid var(--amber);
    border-radius: 999px;
    padding: 3px 8px;
    white-space: nowrap;
  }
  .go { color: var(--ink-soft); font-size: 1.1rem; }

  .foot {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    align-items: baseline;
    justify-content: space-between;
    margin: 0;
    padding: 4px 20px 18px;
    font-size: .8rem;
    color: var(--ink-soft);
  }
  .link-btn {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .link-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .link-btn[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .app { transition: none; }
  }
</style>
</head>
<body>
<div class="card">
  <header class="match">
    <p class="eyebrow" id="eyebrow">Convocazione</p>
    <h1 id="fixture">Vai al campo</h1>
    <p class="when" id="when"></p>
    <div class="venue">
      <span class="venue-name" id="venueName">Campo</span>
      <span class="venue-addr" id="venueAddr"></span>
      <span class="coords" id="coords"></span>
    </div>
  </header>

  <nav class="apps" id="apps" aria-label="Apri la posizione nella tua app di navigazione"></nav>

  <p class="foot">
    <span>La scelta resta salvata su questo dispositivo.</span>
    <button type="button" class="link-btn" id="reset" hidden>Cambia app</button>
  </p>
</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var lat = parseFloat(q.get("lat"));
  var lon = parseFloat(q.get("lon"));

  // Fallback dimostrativo (Susegana U17, 4a giornata, trasferta a Orsago).
  var demo = !isFinite(lat) || !isFinite(lon);
  if (demo) { lat = 45.92616; lon = 12.42758; }

  var venueName = q.get("v") || (demo ? "Campo Comunale" : "Campo");
  var venueAddr = q.get("a") || (demo ? "Via Borgo Basso, Orsago (TV)" : "");
  var fixture   = q.get("n") || (demo ? "vs Orsago" : "Vai al campo");
  var when      = q.get("w") || (demo ? "Domenica 11/10/2026 · 10:15 · in trasferta" : "");
  var eyebrow   = q.get("g") || "Convocazione";

  document.getElementById("eyebrow").textContent = eyebrow;
  document.getElementById("fixture").textContent = fixture;
  document.title = "Vai al campo · " + fixture;
  var whenEl = document.getElementById("when");
  if (when) { whenEl.textContent = when; } else { whenEl.hidden = true; }
  document.getElementById("venueName").textContent = venueName;
  var addrEl = document.getElementById("venueAddr");
  if (venueAddr) { addrEl.textContent = venueAddr; } else { addrEl.hidden = true; }
  document.getElementById("coords").textContent = lat.toFixed(5) + ", " + lon.toFixed(5);

  var ll = lat + "," + lon;
  var label = encodeURIComponent(venueName);
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);

  var pin = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 4.5 7 13 7 13s7-8.5 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></svg>';
  var arrow = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2.5 11.3 20.7 3.6c.9-.4 1.8.5 1.4 1.4l-7.7 18.2c-.4 1-1.9.9-2.2-.2l-2.1-7.2-7.2-2.1c-1.1-.3-1.2-1.8-.1-2.2Z"/></svg>';

  var apps = [
    { id: "waze",  name: "Waze",            sub: "Naviga subito",         mark: "mark-waze",  icon: arrow,
      url: "https://waze.com/ul?ll=" + ll + "&navigate=yes" },
    { id: "gmaps", name: "Google Maps",     sub: "Percorso in auto",      mark: "mark-gmaps", icon: pin,
      url: "https://www.google.com/maps/dir/?api=1&destination=" + ll + "&travelmode=driving" },
    { id: "apple", name: "Apple Mappe",     sub: "Percorso in auto",      mark: "mark-apple", icon: pin,
      url: "https://maps.apple.com/?daddr=" + ll + "&dirflg=d", when: isIOS },
    { id: "geo",   name: "App predefinita", sub: "Scelta dal telefono",   mark: "mark-geo",   icon: pin,
      url: "geo:" + ll + "?q=" + ll + "(" + label + ")", when: isAndroid }
  ].filter(function (a) { return a.when !== false; });

  var osFirst = isIOS ? "apple" : isAndroid ? "geo" : "gmaps";
  apps.sort(function (a, b) { return rank(a.id) - rank(b.id); });
  function rank(id) { return id === osFirst ? 0 : id === "waze" ? 1 : 2; }

  var KEY = "sc_nav_pref";
  var pref = null;
  try { pref = localStorage.getItem(KEY); } catch (e) {}
  if (pref && !apps.some(function (a) { return a.id === pref; })) pref = null;

  var box = document.getElementById("apps");
  var reset = document.getElementById("reset");

  apps.forEach(function (a) {
    var el = document.createElement("a");
    el.className = "app";
    el.href = a.url;
    el.rel = "noopener";
    el.dataset.id = a.id;
    el.dataset.pref = pref && a.id === pref ? "1" : "0";
    el.innerHTML =
      '<span class="mark ' + a.mark + '">' + a.icon + '</span>' +
      '<span class="app-text"><span class="app-name">' + a.name + '</span>' +
      '<span class="app-sub">' + a.sub + '</span></span>' +
      '<span class="tail">' +
        (pref && a.id === pref ? '<span class="chip">predefinita</span>' : '') +
        '<span class="go" aria-hidden="true">&rarr;</span>' +
      '</span>';
    el.addEventListener("click", function () {
      try { localStorage.setItem(KEY, a.id); } catch (e) {}
    });
    box.appendChild(el);
  });

  if (pref) {
    box.classList.add("collapsed");
    reset.hidden = false;
    reset.addEventListener("click", function () {
      box.classList.remove("collapsed");
      reset.hidden = true;
      try { localStorage.removeItem(KEY); } catch (e) {}
      box.querySelectorAll('.app[data-pref="1"]').forEach(function (el) {
        el.dataset.pref = "0";
        var chip = el.querySelector(".chip");
        if (chip) chip.remove();
      });
    });
  }
})();
</script>
</body>
</html>
